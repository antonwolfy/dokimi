name: agent-quality

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Enable strict mode (exit 1 on gate/band fail)'
        required: false
        type: boolean
        default: false

defaults:
  run:
    working-directory: agent-benchmark

jobs:
  # THE executable-track proof for this repo. It is now the only job that
  # builds and verifies a Docker task, because the task definitions no longer
  # live here: they are supplied from an external content checkout via
  # --tasks-root (see agent-benchmark/docs/contributing-terminal-bench-task.md
  # for the format). That makes this the right shape of test anyway -- it
  # exercises the framework against content it did not author.
  #
  # Real end-to-end proof that this repo's own harnesses can pick up and run a
  # skill/task from an external catalog. Clones a real, public
  # uxlfoundation/skills checkout, scans it with `catalog scan`, then runs one
  # of its real tasks through our own `docker-oracle` harness (build + solve +
  # verify), the same code path `docker-claude`/`docker-claude-skill` use for
  # the LLM-driven with-skill/without-skill experiment. It asserts the actual
  # pass rate in "Verify pass rate" below -- `tasks run`'s own exit code does
  # not reflect pass/fail (it is a reporting command, used by callers that want
  # partial results), so without that explicit check this job would stay green
  # even if the external task failed verification. Pinned to a fixed commit
  # (UXL_SKILLS_COMMIT below) and retried 3x on clone so this job's result
  # reflects our own code, not an upstream repo edit or a transient network
  # blip.
  external-catalog-smoke:
    name: External catalog smoke test (uxlfoundation/skills)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      # Pinned, not `main` -- an upstream rename/restructure of
      # onetbb-histogram-local-aggregation (or removal of skills.yaml/
      # suites.json) would otherwise fail this job for reasons unrelated to
      # this repo's own code. Bump deliberately; verify the task path below
      # still resolves at the new commit before bumping.
      UXL_SKILLS_COMMIT: 6feb3f3a0999b1a05868d4486a0e2d7696687763
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Clone uxlfoundation/skills (pinned commit, retried)
        run: |
          set -euo pipefail
          dir="${{ runner.temp }}/uxl-skills"
          for attempt in 1 2 3; do
            rm -rf "$dir"
            mkdir -p "$dir"
            if git -C "$dir" init -q \
                && git -C "$dir" fetch --depth 1 \
                     https://github.com/uxlfoundation/skills "$UXL_SKILLS_COMMIT" \
                && git -C "$dir" checkout -q FETCH_HEAD; then
              break
            fi
            echo "clone attempt $attempt failed" >&2
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - name: catalog scan
        run: |
          python cli.py catalog scan --root "${{ runner.temp }}/uxl-skills" --kind all
      - name: Run a real external task through docker-oracle
        run: |
          python cli.py tasks run \
            --tasks onetbb-histogram-local-aggregation \
            --tasks-root "${{ runner.temp }}/uxl-skills/evaluation/harbor/tasks" \
            --harnesses docker-oracle \
            --out-json "${{ github.workspace }}/logs/external-catalog-smoke/runs.json"
      - name: Verify pass rate
        run: |
          python - "${{ github.workspace }}/logs/external-catalog-smoke/runs.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          stats = data["summary"]["per_harness"]["docker-oracle"]
          print(f"docker-oracle: {stats['passed']}/{stats['n']} pass (rate={stats['pass_rate']})")
          sys.exit(0 if stats["pass_rate"] == 1.0 else 1)
          PY
      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-catalog-smoke-runs
          path: ${{ github.workspace }}/logs/external-catalog-smoke/

  benchmark:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event.inputs.strict != 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run benchmark
        run: |
          python cli.py run --root . --spec benchmarks/spec.v1.yaml \
            --out-json baselines/current.json --out-md reports/current.md \
            ${{ github.event.inputs.strict == 'true' && '--strict' || '' }}
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-quality-report
          path: |
            agent-benchmark/baselines/current.json
            agent-benchmark/reports/current.md
