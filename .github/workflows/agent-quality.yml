name: agent-quality

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Enable strict mode (exit 1 on gate/band fail)'
        required: false
        type: boolean
        default: false

defaults:
  run:
    working-directory: agent-benchmark

jobs:
  terminal-bench-verify:
    name: Verify terminal-bench-tasks (oracle solutions)
    runs-on: ubuntu-latest
    env:
      TERMINAL_BENCH_TASKS: >-
        onetbb-parallel-sort onetbb-nstream onetbb-stencil onetbb-transpose
        onetbb-parallel-reduce onetbb-parallel-scan onetbb-flow-graph
        intel-perf-serial-accumulator intel-perf-false-sharing
        intel-perf-shared-counter intel-perf-missing-restrict
        intel-perf-hotspot-report intel-perf-ttas-spinlock
        intel-perf-mutex-rwlock intel-perf-cv-herd intel-perf-crc32c
        intel-perf-simd-sort
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Build Docker images
        run: |
          set -euo pipefail
          for task in $TERMINAL_BENCH_TASKS
          do
            docker build \
              -t "intel-hpc-bench/${task}:latest" \
              "terminal-bench-tasks/${task}/environment/"
          done

      - name: Run oracle solutions + verifiers inside containers
        run: |
          set -euo pipefail
          for task in $TERMINAL_BENCH_TASKS
          do
            mkdir -p "${{ github.workspace }}/logs/${task}"
            chmod 777 "${{ github.workspace }}/logs/${task}"
            docker run --rm \
              --network none \
              --cpus=4 \
              --memory=2g \
              -v "${{ github.workspace }}/agent-benchmark/terminal-bench-tasks/${task}/solution:/solution:ro" \
              -v "${{ github.workspace }}/agent-benchmark/terminal-bench-tasks/${task}/tests:/tests:ro" \
              -v "${{ github.workspace }}/logs/${task}:/logs" \
              "intel-hpc-bench/${task}:latest" \
              bash -c "bash /solution/solve.sh && bash /tests/test.sh"

            REWARD=$(cat "${{ github.workspace }}/logs/${task}/verifier/reward.txt" | tr -d '[:space:]')
            echo "${task} reward: $REWARD"
            if [ "$REWARD" != "1" ]; then
              echo "❌ ${task} oracle solution did not pass all tests (reward=$REWARD)"
              exit 1
            fi
            echo "✅ ${task} oracle solution passed all tests"
          done

      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-bench-logs
          path: ${{ github.workspace }}/logs/

  # Tasks that depend on the Intel oneAPI apt repo (oneMKL, IPP),
  # header-only oneDPL, or large pip installs (sklearnex). Each task is a
  # separate matrix leg (one check run per task, fail-fast disabled) so a
  # failure or heavy build in one cannot affect the core oneTBB job above and
  # the per-task pass/fail is visible at a glance.
  terminal-bench-verify-oneapi:
    name: Verify oneAPI task
    runs-on: ubuntu-latest
    # Verify-only job: it just checks out the repo and builds/runs containers,
    # so restrict the token to read access.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task:
          - sklearnex-classification
          - onemkl-dgemm
          - onemkl-fft
          - onedpl-transform-reduce
          - ipp-dotprod
          - dpnp-device-fallback
          - dpnp-fft-pipeline
          - dpnp-linalg-matmul
          - dpnp-migration-replace-numpy
          - dpnp-reduction-stats
          - mkl-fft-patch-numpy
          - mkl-random-parallel-streams
          - mkl-umath-coverage-report
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h /

      - name: Build, run, and verify ${{ matrix.task }} (offline verification)
        run: |
          set -euo pipefail
          task="${{ matrix.task }}"
          echo "::group::build ${task}"
          docker build \
            -t "intel-hpc-bench/${task}:latest" \
            "terminal-bench-tasks/${task}/environment/"
          echo "::endgroup::"

          mkdir -p "${{ github.workspace }}/logs/${task}"
          docker run --rm \
            --network none \
            --shm-size=2g \
            --cpus=4 \
            --memory=4g \
            -v "${{ github.workspace }}/agent-benchmark/terminal-bench-tasks/${task}/solution:/solution:ro" \
            -v "${{ github.workspace }}/agent-benchmark/terminal-bench-tasks/${task}/tests:/tests:ro" \
            -v "${{ github.workspace }}/logs/${task}:/logs" \
            "intel-hpc-bench/${task}:latest" \
            bash -c "bash /solution/solve.sh && bash /tests/test.sh"

          REWARD=$(cat "${{ github.workspace }}/logs/${task}/verifier/reward.txt" | tr -d '[:space:]')
          echo "${task} reward: $REWARD"
          if [ "$REWARD" != "1" ]; then
            echo "❌ ${task} oracle solution did not pass all tests (reward=$REWARD)"
            exit 1
          fi
          echo "✅ ${task} oracle solution passed all tests"

      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terminal-bench-oneapi-logs-${{ matrix.task }}
          path: ${{ github.workspace }}/logs/

  # What this job proves, and what it deliberately does not.
  #
  # BLOCKING: `pip install harbor` resolves at the pinned version and the
  # task image builds. Those are this repo's own contract and they must not
  # regress silently.
  #
  # NOT BLOCKING: the `harbor run -a oracle` step. Two independent reasons
  # a green run there would mean nothing:
  #
  #   1. `harbor run` does not propagate a non-zero exit code for
  #      errored/cancelled trials, so success is unobservable from $?.
  #   2. This runner cannot satisfy what the task asks for. It has failed
  #      three ways across real CI runs: a swallowed "docker compose ...
  #      unknown flag: --project-name" (no Compose v2 here), and -- since
  #      Harbor started rejecting policies it cannot enforce -- a hard
  #      "network_mode='no-network' is not supported by
  #      EnvironmentType.DOCKER". The latter is Harbor being correct:
  #      onetbb-parallel-sort's task.toml sets `allow_internet = false`,
  #      Harbor maps that to network_mode='no-network', and the docker
  #      provider only advertises the `disable_internet` capability when
  #      `_egress_control_kernel_support()` holds -- which it does not in
  #      this dind runner. Refusing beats running the oracle with an
  #      internet connection the task forbade.
  #
  # So continue-on-error sits on that ONE step, not on the job: an infra
  # limitation this repo does not control stays non-fatal, while a broken
  # `pip install` or a broken Dockerfile still reddens CI. The result.json
  # dump and artifact upload below keep the real Harbor exit state visible
  # to a human either way. Promote the run step to blocking once the runner
  # has Compose v2 + egress control, and assert on result.json here.
  #
  # Harbor is pinned: an unpinned `pip install harbor` silently moved this
  # job from 0.21.0 to 0.22.0 and changed its failure mode mid-PR. Bump
  # deliberately, so a new Harbor release is a reviewed diff and not a
  # surprise red X on an unrelated PR.
  harbor-oracle-smoke:
    name: Harbor install/build smoke test (harbor run is best-effort)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Harbor
        run: pip install 'harbor==0.22.0'
      - name: Build task image
        run: |
          docker build \
            -t intel-hpc-bench/onetbb-parallel-sort:latest \
            terminal-bench-tasks/onetbb-parallel-sort/environment/
      - name: harbor run -a oracle (best-effort; see job comment)
        continue-on-error: true
        run: |
          harbor run \
            -p terminal-bench-tasks/onetbb-parallel-sort \
            -a oracle \
            --jobs-dir "${{ github.workspace }}/logs/harbor-oracle-smoke"
      - name: Print harbor result.json stats
        if: always()
        run: |
          result="$(find "${{ github.workspace }}/logs/harbor-oracle-smoke" -name result.json | head -1)"
          if [ -n "$result" ]; then cat "$result"; else echo "no result.json found"; fi
      - name: Upload harbor job output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harbor-oracle-smoke-jobs
          path: ${{ github.workspace }}/logs/harbor-oracle-smoke/

  # Real end-to-end proof that this repo's own harnesses (not just Harbor,
  # attempted above) can pick up and run a skill/task from an external
  # catalog it did not author. Clones a real, public uxlfoundation/skills
  # checkout, scans it with `catalog scan`, then runs one of its real tasks
  # through our own `docker-oracle` harness (build + solve + verify), the
  # same code path `docker-claude`/`docker-claude-skill` use for the
  # LLM-driven with-skill/without-skill experiment. Unlike harbor-oracle-
  # smoke above, this job asserts the actual pass rate in "Verify pass
  # rate" below -- `tasks run`'s own exit code does not reflect pass/fail
  # (it is a reporting command, used by callers that want partial results),
  # so without that explicit check this job would stay green even if the
  # external task failed verification, exactly like the Harbor job. Pinned
  # to a fixed commit (UXL_SKILLS_COMMIT below) and retried 3x on clone so
  # this job's result reflects our own code, not an upstream repo edit or a
  # transient network blip.
  external-catalog-smoke:
    name: External catalog smoke test (uxlfoundation/skills)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      # Pinned, not `main` -- an upstream rename/restructure of
      # onetbb-histogram-local-aggregation (or removal of skills.yaml/
      # suites.json) would otherwise fail this job for reasons unrelated to
      # this repo's own code. Bump deliberately; verify the task path below
      # still resolves at the new commit before bumping.
      UXL_SKILLS_COMMIT: 6feb3f3a0999b1a05868d4486a0e2d7696687763
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Clone uxlfoundation/skills (pinned commit, retried)
        run: |
          set -euo pipefail
          dir="${{ runner.temp }}/uxl-skills"
          for attempt in 1 2 3; do
            rm -rf "$dir"
            mkdir -p "$dir"
            if git -C "$dir" init -q \
                && git -C "$dir" fetch --depth 1 \
                     https://github.com/uxlfoundation/skills "$UXL_SKILLS_COMMIT" \
                && git -C "$dir" checkout -q FETCH_HEAD; then
              break
            fi
            echo "clone attempt $attempt failed" >&2
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - name: catalog scan
        run: |
          python cli.py catalog scan --root "${{ runner.temp }}/uxl-skills" --kind all
      - name: Run a real external task through docker-oracle
        run: |
          python cli.py tasks run \
            --tasks onetbb-histogram-local-aggregation \
            --tasks-root "${{ runner.temp }}/uxl-skills/evaluation/harbor/tasks" \
            --harnesses docker-oracle \
            --out-json "${{ github.workspace }}/logs/external-catalog-smoke/runs.json"
      - name: Verify pass rate
        run: |
          python - "${{ github.workspace }}/logs/external-catalog-smoke/runs.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          stats = data["summary"]["per_harness"]["docker-oracle"]
          print(f"docker-oracle: {stats['passed']}/{stats['n']} pass (rate={stats['pass_rate']})")
          sys.exit(0 if stats["pass_rate"] == 1.0 else 1)
          PY
      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-catalog-smoke-runs
          path: ${{ github.workspace }}/logs/external-catalog-smoke/

  benchmark:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event.inputs.strict != 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run benchmark
        run: |
          python cli.py run --root . --spec benchmarks/spec.v1.yaml \
            --out-json baselines/current.json --out-md reports/current.md \
            ${{ github.event.inputs.strict == 'true' && '--strict' || '' }}
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-quality-report
          path: |
            agent-benchmark/baselines/current.json
            agent-benchmark/reports/current.md
