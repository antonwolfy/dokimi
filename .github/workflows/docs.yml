# Documentation site: dokimi/mkdocs.yml, built from dokimi/docs/ plus the CLI and
# API reference generated from the code. Every PR builds it with --strict, so a
# broken link or anchor fails the check; a push to main publishes it to GitHub
# Pages (repository Settings -> Pages -> Source: GitHub Actions).

name: docs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: dokimi

env:
  # Material's notice about MkDocs 2.0; requirements-docs.txt pins mkdocs<2.
  DISABLE_MKDOCS_2_WARNING: 'true'

jobs:
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      # The locks, not the ranges, as in ci.yml: a PR's result should not depend on
      # what was released upstream that morning.
      - run: pip install -r requirements.lock.txt -r requirements-docs.lock.txt
      - name: mkdocs build
        run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dokimi/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
